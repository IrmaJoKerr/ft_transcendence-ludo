networks:
  transcendence_network:
    name: transcendence_network
    driver: bridge

services:
  db:
    build:
      context: ./backend/app/postgres_16_db
      dockerfile: Dockerfile
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db_bossman}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: a bare "5432:5432" would expose Postgres
      # to every device on the WiFi. Still reachable from the host for psql.
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-db_bossman} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_network

  redis:
    build:
      context: ./backend/app/redis
      dockerfile: Dockerfile
    container_name: redis
    restart: unless-stopped
    env_file: .env
    networks:
      - transcendence_network
    volumes:
      - redis_data:/data
    expose:
      - "6479"
    ports:
      # Loopback-only: lets `npm run db:seed` and other scripts reach Redis
      # from the host. Not for direct exposure.
      - 127.0.0.1:6479:6479

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6479 -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_HOST: redis
      REDIS_PORT: 6479
      # Overrides .env's host-reachable DATABASE_URL with the container form
      # (hostname "db" instead of "localhost"): see backend/prisma.config.ts.
      DATABASE_URL: ${CONTAINER_DATABASE_URL}
    ports:
      # Loopback-only: clients always reach the backend through nginx's
      # /api/ proxy, never directly. Published purely for host-side debugging.
      - 127.0.0.1:3000:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence_network
    # Least privilege, as defence in depth: the image already runs as the
    # unprivileged `node` user (backend/Dockerfile), and here the process gets no
    # Linux capability at all and no way to gain one, so a compromise of the app
    # or of an image decoder cannot escalate. The memory cap bounds a
    # decompression bomb that slips past the decoder's own pixel limit: Node's
    # heap is sized from this limit, so the container is OOM-killed (and
    # restarted) rather than taking the host down with it.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    # `make dev` runs `compose watch`: no bind mount here, so on a source
    # change compose rebuilds the image and recreates the container instead
    # of syncing files into a running one.
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - node_modules
            - dist
            - generated

  # Web UI over the `db` service's data. Reuses the backend image so no
  # separate build/config is needed.
  studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studio
    restart: unless-stopped
    # Skip docker-entrypoint.sh: it re-runs `prisma db push`, which races
    # against backend's own push on container startup and crash-loops both
    # containers on a Postgres pg_type unique-constraint collision. Studio
    # only needs to browse the schema backend already owns/pushes.
    # Prisma 7 Studio only binds 127.0.0.1 inside the container (no --hostname
    # flag), which Docker's port publishing can't reach. A tiny Node TCP relay
    # listens on the container's network IP(s) on the same port 5555 and
    # forwards to 127.0.0.1:5555. The port must stay identical: Studio rejects
    # API requests (403) whose Origin isn't localhost/127.0.0.1:<its port>.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        node -e 'const net=require("net");for(const a of Object.values(require("os").networkInterfaces()).flat())if(!a.internal&&a.family==="IPv4")net.createServer(c=>{const u=net.connect(5555,"127.0.0.1");c.pipe(u).pipe(c);c.on("error",()=>u.destroy());u.on("error",()=>c.destroy())}).listen(5555,a.address)' &
        exec npx prisma studio --port 5555 --browser none
    env_file: .env
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL}
    ports:
      # Loopback-only: this is a raw DB browser/editor, never expose it beyond the host.
      - 127.0.0.1:5555:5555
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence_network

  ludo-engine:
    build:
      context: ./backend/app/ludo-engine
      dockerfile: Dockerfile
    container_name: ludo-engine
    restart: unless-stopped
    networks:
      - transcendence_network
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Loopback-only, same reasoning as backend's: a host-run `npm run dev`
      # (vite.config.ts's default, non-containerized proxy target) needs this
      # reachable at localhost:3001, while clients in prod/nginx still go through
      # the container network via `expose`, this is purely for host-side dev.
      - 127.0.0.1:3001:3001
    expose:
      - "3001"
    environment:
      REDIS_HOST: redis
      ENGINE_PORT: 3001
      # Socket.IO CORS allow-list: the LAN origin plus the static ngrok domain.
      # The engine refuses to start if this resolves to an empty list, so the
      # FRONTEND_URL default keeps a bare `docker compose up` working.
      CORS_ORIGIN: "${FRONTEND_URL:-https://localhost:8443},${NGROK_FRONTEND_URL}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })\""]
      interval: 10s
      timeout: 5s
      retries: 3
    # See backend's `develop.watch` comment above: same reasoning applies here.
    develop:
      watch:
        - action: rebuild
          path: ./backend/app/ludo-engine
          ignore:
            - node_modules
            - dist


  # Long-running publisher: builds the SPA into spa_dist, then watches
  # ./src and republishes on every change instead of exiting.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    volumes:
      - spa_dist:/export
      - ./frontend:/app
      # Anonymous volume: keeps the image's node_modules from being shadowed
      # by the bind mount above, which has none on the host.
      - /app/node_modules
    networks:
      - transcendence_network
    healthcheck:
      test: ["CMD", "test", "-f", "/export/index.html"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Optional HMR dev server, started only by `make dev` (profile: dev). Serves
  # source straight from the bind mount on 8080; the built-and-served-by-nginx
  # path on 8443 keeps running alongside it, untouched.
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    profiles:
      - dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the image's node_modules from being shadowed by
      # the bind mount above, which has none on the host.
      - /app/node_modules
    environment:
      VITE_IN_CONTAINER: "true"
      VITE_API_TARGET: http://backend:3000
      VITE_ENGINE_TARGET: http://ludo-engine:3001
    depends_on:
      backend:
        condition: service_started
      ludo-engine:
        condition: service_started
    networks:
      - transcendence_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8443:443"
      - "127.0.0.1:8444:444"
    volumes:
      - spa_dist:/usr/share/nginx/html:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf/app.inc:/etc/nginx/app.inc:ro
    depends_on:
      # Waiting on the healthcheck (first publish) is what keeps nginx from
      # booting onto an empty document root the first time the stack comes up.
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
      ludo-engine:
        condition: service_started
    networks:
      - transcendence_network

volumes:
  db_data:
  redis_data:
  spa_dist:
