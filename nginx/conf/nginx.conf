events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 10M;

    # Larger buffers for big response headers (JWT Set-Cookie pairs) and long
    # request headers (full cookie jar). Defensive; also silences "upstream
    # sent too big header" for /api/* proxied responses.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 16k;

    # Per-IP request throttling for the leaderboard API (defense in depth
    # behind the backend's JWT guard). 30 req/min sustained with a burst of
    # 20 — enough for normal page loads/filters, tight against hammering.
    limit_req_zone $binary_remote_addr zone=leaderboard:10m rate=30r/m;

    # Rate-limited requests answer 429 Too Many Requests, matching the NestJS
    # throttler. nginx's default here is 503, which reads as "server broken":
    # clients retry it, and monitoring counts it as an outage.
    limit_req_status 429;

    # Edge-level auth throttling (defense in depth behind the NestJS
    # throttler — nginx sees the true peer IP via $binary_remote_addr,
    # which can't be spoofed the way X-Forwarded-For can).
    #
    # `rate` is a leaky bucket, not a per-minute quota: 60r/m = one token every
    # second, and `burst` is how many can be spent at once. The generic zone
    # covers /api/auth/me and /api/auth/logout, which the SPA calls on its own
    # (every page load, every tab) — at the old 10r/m a handful of tabs spent
    # the whole bucket and got thrown a 503 mid-session.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # /api/auth/refresh gets its own budget: apiFetch fires it automatically on
    # any 401, so several tabs resuming at once burst legitimately. Kept in step
    # with the 30/min @Throttle on the route in auth.controller.ts.
    limit_req_zone $binary_remote_addr zone=refresh:10m rate=30r/m;

    # WebSocket upgrade: echo "upgrade" back on Upgrade requests, "close"
    # otherwise. Used by the /socket.io/ proxy below (ludo-engine Socket.IO).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS. Required so proxy_pass re-resolves service
    # hostnames on every request instead of caching the IP for the life of
    # the worker process — without this, restarting backend/ludo-engine
    # (common in dev) leaves nginx stuck retrying a dead container IP until
    # nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    # ═══════════════════════════════════════════════════════════
    # MAIN HTTPS SERVER — serves the React SPA + proxies API/WebSocket.
    # See conf/app.inc for the actual routing (shared so the local
    # and ngrok-tunnelled paths, which both terminate here, can't drift).
    # ═══════════════════════════════════════════════════════════
    server {
        # Listen ONLY on port 443 with strict SSL/TLS parameters
        listen 443 ssl;
        listen [::]:443 ssl;

        # ═══════════════════════════════════════════════════════
        # MODIFY: Change this to your actual domain name
        # ═══════════════════════════════════════════════════════
        server_name transcendence-ludo;

        # TLS Protocols mandate (strictly no SSLv3, TLSv1.0, or TLSv1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/transcendence.crt;
        ssl_certificate_key /etc/nginx/ssl/transcendence.key;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://assets.codepen.io; img-src 'self' data: https:; connect-src 'self' ws: wss:;" always;

        # Root directory of the React SPA static files
        root /usr/share/nginx/html;
        index index.html;

        # ═══════════════════════════════════════════════════════
        # SPA ROUTING — all non-file requests serve index.html
        # so React Router handles the frontend navigation
        # ═══════════════════════════════════════════════════════
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ═══════════════════════════════════════════════════════
        # LEADERBOARD API — GET-only, per-IP throttled. Exact match
        # wins over the generic /api/ prefix below.
        # ═══════════════════════════════════════════════════════
        location = /api/leaderboard {
            if ($request_method !~ ^(GET)$) {
                return 405;
            }
            limit_req zone=leaderboard burst=20 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ═══════════════════════════════════════════════════════
        # AUTH API — per-IP throttled, tighter than the generic /api/
        # prefix below. Exact match on /api/auth/login wins over the
        # broader /api/auth/ prefix, which wins over /api/.
        # ═══════════════════════════════════════════════════════
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exact match, so it wins over the /api/auth/ prefix below.
        location = /api/auth/refresh {
            limit_req zone=refresh burst=15 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ═══════════════════════════════════════════════════════
        # API PROXY — forwards /api/* requests to backend
        # ═══════════════════════════════════════════════════════
        location /api/ {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE STREAMING MODE — /api/notifications/stream is an
            # EventSource (text/event-stream) that must push frames the moment
            # they arrive. Without these directives nginx BUFFERS the response
            # (toasts arrive late/never) and the default 60s proxy_read_timeout
            # kills the idle stream every minute — seen as nginx "upstream
            # timed out" + the client's EventSource reconnecting in a loop.
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Build health check — returns backend status through nginx
        location = /api/health {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream/health;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══════════════════════════════════════════════════════
        # ENGINE WEBSOCKET PROXY — forwards Socket.IO traffic to the
        # ludo-engine over the same secure origin (wss://<host>/socket.io/).
        # Gives the browser a same-origin, TLS path to the engine so it
        # never has to reach ludo-engine:3001 directly (blocked as mixed
        # content, and unresolvable from the host anyway).
        # ═══════════════════════════════════════════════════════
        location /socket.io/ {
            set $engine_upstream http://ludo-engine:3001;
            proxy_pass $engine_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Long-lived sockets: don't cut idle gameplay connections at 60s.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Deny access to hidden files (e.g. .htaccess, .git, .env)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
