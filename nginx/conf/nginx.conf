events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Largest legitimate body is a 2 MB avatar upload, so this leaves headroom
    # without letting a large body be buffered before the API rejects it.
    client_max_body_size 3M;

    # Per-IP request throttling for the leaderboard API (defense in depth
    # behind the backend's JWT guard). 30 req/min sustained with a burst of
    # 20 is enough for normal page loads/filters, tight against hammering.
    limit_req_zone $binary_remote_addr zone=leaderboard:10m rate=30r/m;

    # Rate-limited requests answer 429 Too Many Requests, matching the NestJS
    # throttler. nginx's default here is 503, which reads as "server broken":
    # clients retry it, and monitoring counts it as an outage.
    limit_req_status 429;

    # Same status for the connection cap below, for the same reason.
    limit_conn_status 429;

    # Edge-level auth throttling (defense in depth behind the NestJS
    # throttler: nginx sees the true peer IP via $binary_remote_addr,
    # which can't be spoofed the way X-Forwarded-For can).
    #
    # `rate` is a leaky bucket, not a per-minute quota: 60r/m = one token every
    # second, and `burst` is how many can be spent at once. The generic zone
    # covers /api/auth/me and /api/auth/logout, which the SPA calls on its own
    # (every page load, every tab): at the old 10r/m a handful of tabs spent
    # the whole bucket and got thrown a 503 mid-session.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Everything else under /api/ (user, friends, game, notifications, stats).
    # Previously unlimited. Loose on purpose: one SPA page load fans out into
    # several of these, so this is a ceiling on hammering, not a usage quota.
    limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;

    # /api/auth/refresh gets its own budget: apiFetch fires it automatically on
    # any 401, so several tabs resuming at once burst legitimately. Kept in step
    # with the 30/min @Throttle on the route in auth.controller.ts.
    limit_req_zone $binary_remote_addr zone=refresh:10m rate=30r/m;

    # /api/match/guest: the only public (account-less) room allocator. It gets
    # its own budget instead of riding api's burst=100, in step with the route's
    # @Throttle and the per-address mint ladder in GuestLimitService.
    limit_req_zone $binary_remote_addr zone=guest:10m rate=10r/m;

    # Cap on requests in flight per address, on top of the request-rate zones
    # above: a rate limit allows a burst but does not cap how many are served at
    # once. It does not cover half-open request headers, which timeouts bound.
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # WebSocket upgrade: echo "upgrade" back on Upgrade requests, "close"
    # otherwise. Used by the /socket.io/ proxy below (ludo-engine Socket.IO).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS. Required so proxy_pass re-resolves service
    # hostnames on every request instead of caching the IP for the life of
    # the worker process: without this, restarting backend/ludo-engine
    # (common in dev) leaves nginx stuck retrying a dead container IP until
    # nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    # TLS hardening shared by both listeners: ECDHE-only ciphers for TLS 1.2
    # (TLS 1.3 ciphersuites are fixed) and no session tickets, which would
    # weaken forward secrecy. ssl_protocols stays with each listener below.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # ═══════════════════════════════════════════════════════════
    # DIRECT HTTPS LISTENER: localhost and LAN clients.
    # Serves the React SPA + proxies API/WebSocket. The routing lives in
    # conf/app.inc, shared with the :444 tunnel listener below so the two
    # modes can't drift.
    #
    # No real_ip here on purpose. Docker's port forwarding plus Docker's NAT
    # rewrite the source address of every direct client to the bridge gateway,
    # and no header carries the original, so $remote_addr is 172.18.0.1 for
    # all of them. That makes the limits here a shared bucket, which is the
    # honest state of things: a client-supplied header is the only other
    # candidate and trusting it would let anyone pick their own bucket.
    # ═══════════════════════════════════════════════════════════
    server {
        # Listen ONLY on port 443 with strict SSL/TLS parameters
        listen 443 ssl;
        listen [::]:443 ssl;

        # ═══════════════════════════════════════════════════════
        # MODIFY: Change this to your actual domain name
        # ═══════════════════════════════════════════════════════
        server_name transcendence-ludo;

        # TLS Protocols mandate (strictly no SSLv3, TLSv1.0, or TLSv1.1).
        # Ciphers and session tickets are shared; see the http block.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/transcendence.crt;
        ssl_certificate_key /etc/nginx/ssl/transcendence.key;

        # This listener serves the host the user typed, so it may pin that host
        # and its subdomains. The tunnel listener below sends no includeSubDomains:
        # its public host is an ngrok domain we do not own.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Every direct client arrives as the same bridge address (see above), so a
        # cap here is a shared ceiling rather than a per-client one: set high.
        limit_conn conn 100;

        include /etc/nginx/app.inc;
    }

    # ═══════════════════════════════════════════════════════════
    # TUNNEL LISTENER: ngrok only.
    #
    # Published by compose as 127.0.0.1:8444, so nothing outside this host
    # can open a connection to it. The only local process that does is the
    # ngrok agent started by `make tunnel` (NGROK_PORT=8444).
    #
    # That reachability is the whole basis for trusting X-Forwarded-For
    # here. ngrok terminates the visitor's connection at its edge and puts
    # the visitor's address in that header; the agent then forwards to this
    # port, so by the time nginx sees the request the peer address is the
    # Docker gateway and the header is the only record of who sent it.
    #
    # The same trust must NOT be extended on :443, where any localhost or
    # LAN client could set the header themselves. Host-based matching would
    # not do: the client chooses Host too. The port is the boundary.
    # ═══════════════════════════════════════════════════════════
    server {
        listen 444 ssl;
        listen [::]:444 ssl;

        # Any Host: the public hostname is whatever ngrok domain is in use,
        # and this listener is unreachable except through the agent anyway.
        server_name _;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/transcendence.crt;
        ssl_certificate_key /etc/nginx/ssl/transcendence.key;

        # Bare max-age only: the public host on this path is an ngrok subdomain,
        # and pinning subdomains of a domain we do not own is wrong.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Keyed on the address real_ip resolved above, so this is a real
        # per-visitor cap on requests in flight, and long-lived streams and slow
        # reads are what would otherwise let one client hold many open.
        limit_conn conn 30;

        # Resolve the real client address out of X-Forwarded-For, but only
        # believe the header when the connection itself came from a private
        # address, which is where the agent's traffic arrives from.
        #
        # All private ranges rather than one subnet on purpose: compose does not
        # pin a subnet for transcendence_network, so Docker assigns one from its
        # pool and the result differs per host (172.18 here, something else on a
        # machine with other compose projects). Naming a single subnet would make
        # this silently stop working after a move, with no error and no spoofing
        # risk, just a shared bucket again.
        #
        # Widening it costs nothing because the port is what bounds the trust:
        # compose publishes this listener on 127.0.0.1 only, so the only peers
        # that can ever reach it are on this host.
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 127.0.0.0/8;
        real_ip_header   X-Forwarded-For;
        # Walk the header right-to-left, skipping addresses in the trusted
        # range above, and take the first one that is not. This is what makes
        # a visitor's own X-Forwarded-For useless to them: ngrok appends their
        # true address after anything they sent, so theirs is never the one
        # picked. It is also correct if ngrok replaces the header instead.
        real_ip_recursive on;

        include /etc/nginx/app.inc;
    }
}
